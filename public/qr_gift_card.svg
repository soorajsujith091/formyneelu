<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="1200" viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .card-border { fill: none; stroke: #e5e7eb; stroke-width: 2.5; rx: 32; }
      .title-text {
        font-family: 'Segoe UI', -apple-system, 'Century Gothic', Arial, sans-serif;
        font-size: 60px;
        font-weight: 800;
        fill: #111827;
        text-anchor: middle;
        letter-spacing: -0.01em;
      }
      .divider-line { stroke: #374151; stroke-width: 2; stroke-linecap: round; }
      .heart-symbol {
        font-family: 'Segoe UI Symbol', Arial, sans-serif;
        font-size: 26px;
        fill: #1f2937;
        text-anchor: middle;
      }
      .scan-instruction {
        font-family: 'Segoe UI', -apple-system, Arial, sans-serif;
        font-size: 22px;
        font-weight: 500;
        fill: #4b5563;
        text-anchor: middle;
        letter-spacing: 0.02em;
      }
      .couple-rewind {
        font-family: 'Georgia', 'Times New Roman', serif;
        font-size: 42px;
        font-weight: 500;
        font-style: italic;
        fill: #111827;
        text-anchor: middle;
        letter-spacing: 0.02em;
      }
    </style>
  </defs>

  <!-- Clean Minimalist Card Background -->
  <rect width="800" height="1200" class="bg" />
  <rect x="30" y="30" width="740" height="1140" class="card-border" />

  <!-- Header: "A special Gift" (Matching Reference Image) -->
  <text x="400" y="195" class="title-text">A special</text>
  <text x="400" y="270" class="title-text">Gift</text>

  <!-- Divider with Heart: ——— ♡ ——— -->
  <line x1="225" y1="325" x2="365" y2="325" class="divider-line" />
  <text x="400" y="333" class="heart-symbol">♡</text>
  <line x1="435" y1="325" x2="575" y2="325" class="divider-line" />

